<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
  <title id="title">Passing a copy of a value</title>
  <desc id="desc">In main(), value contains 99 at address 0x1000. A purple arrow labelled copy of 99 goes to number in increment(), at address 0x2000, which now contains 100 after number++. value in main() is still 99.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
    <marker id="arrow-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b392f0"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .region { fill: #393842; stroke: #5a5968; stroke-width: 1.5; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .copy { stroke: #b392f0; stroke-width: 3; fill: none; }
    .copylabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #b392f0; }
    .code { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="288" rx="12"/>
  <rect class="region" x="20" y="30" width="250" height="180" rx="8"/>
  <text class="name" x="34" y="56">main()</text>
  <rect class="region" x="370" y="30" width="250" height="180" rx="8"/>
  <text class="name" x="384" y="56">increment()</text>
  <text class="name" x="145" y="92" text-anchor="middle">value</text>
  <text class="type" x="145" y="110" text-anchor="middle">int</text>
  <rect class="var" x="85" y="120" width="120" height="52" rx="6"/>
  <text class="value" x="145" y="154" text-anchor="middle">99</text>
  <text class="addr" x="145" y="194" text-anchor="middle">address 0x1000</text>
  <text class="name" x="495" y="92" text-anchor="middle">number</text>
  <text class="type" x="495" y="110" text-anchor="middle">int</text>
  <rect class="var" x="435" y="120" width="120" height="52" rx="6"/>
  <text class="value" x="495" y="154" text-anchor="middle">100</text>
  <text class="addr" x="495" y="194" text-anchor="middle">address 0x2000</text>
  <line class="copy" x1="207" y1="146" x2="429" y2="146" marker-end="url(#arrow-copy)"/>
  <text class="copylabel" x="320" y="136" text-anchor="middle">copy of 99</text>
  <text class="note" x="145" y="234" text-anchor="middle">still 99</text>
  <text class="note" x="495" y="234" text-anchor="middle"><tspan class="code">number++</tspan> changes only the copy</text>
  <text class="note" x="320" y="270" text-anchor="middle">Addresses are made up: real ones are much longer.</text>
</svg>
