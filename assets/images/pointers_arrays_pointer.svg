<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
  <title id="title">A pointer to the first element of an array</title>
  <desc id="desc">The pointer value_pointer contains 0x1000 and points to values[0], which holds 10. The expression value_pointer + 1 points to values[1], at 0x1004, which holds 20. The array values holds 10, 20, 30, 40 and 50 at addresses 0x1000 to 0x1010.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .exprlabel { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #f2a65a; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="288" rx="12"/>
  <text class="name" x="85" y="82" text-anchor="middle">value_pointer</text>
  <text class="type" x="85" y="104" text-anchor="middle">int *</text>
  <rect class="ptr" x="20" y="110" width="130" height="52" rx="6"/>
  <text class="value" x="85" y="144" text-anchor="middle">0x1000</text>
  <text class="type" x="250" y="100" text-anchor="middle">[0]</text>
  <rect class="var" x="210" y="110" width="80" height="52"/>
  <text class="value" x="250" y="144" text-anchor="middle">10</text>
  <text class="addr" x="250" y="184" text-anchor="middle">0x1000</text>
  <text class="type" x="330" y="100" text-anchor="middle">[1]</text>
  <rect class="var" x="290" y="110" width="80" height="52"/>
  <text class="value" x="330" y="144" text-anchor="middle">20</text>
  <text class="addr" x="330" y="184" text-anchor="middle">0x1004</text>
  <text class="type" x="410" y="100" text-anchor="middle">[2]</text>
  <rect class="var" x="370" y="110" width="80" height="52"/>
  <text class="value" x="410" y="144" text-anchor="middle">30</text>
  <text class="addr" x="410" y="184" text-anchor="middle">0x1008</text>
  <text class="type" x="490" y="100" text-anchor="middle">[3]</text>
  <rect class="var" x="450" y="110" width="80" height="52"/>
  <text class="value" x="490" y="144" text-anchor="middle">40</text>
  <text class="addr" x="490" y="184" text-anchor="middle">0x100c</text>
  <text class="type" x="570" y="100" text-anchor="middle">[4]</text>
  <rect class="var" x="530" y="110" width="80" height="52"/>
  <text class="value" x="570" y="144" text-anchor="middle">50</text>
  <text class="addr" x="570" y="184" text-anchor="middle">0x1010</text>
  <text class="name" x="210" y="216">values</text><text class="type" x="290" y="216">int[5]</text>
  <line class="arrow" x1="152" y1="136" x2="204" y2="136" marker-end="url(#arrow)"/>
  <text class="exprlabel" x="354" y="40" text-anchor="middle">value_pointer + 1</text>
  <line class="arrow" x1="354" y1="48" x2="354" y2="104" marker-end="url(#arrow)"/>
  <text class="note" x="320" y="252" text-anchor="middle">Adding 1 moves to the next int, 4 bytes further on.</text>
  <text class="note" x="320" y="272" text-anchor="middle">Addresses are made up: real ones are much longer.</text>
</svg>
