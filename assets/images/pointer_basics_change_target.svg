<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Changing a pointer's target</title>
  <desc id="desc">The pointer target_hp now contains 0x1004, the address of eevee_hp, which contains 28. A faded dashed arrow shows that it used to point to pikachu_hp, at address 0x1000, which contains 35. A solid arrow shows that it now points to eevee_hp.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
    <marker id="arrow-old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77768a"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .old { stroke: #77768a; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
    .oldlabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #8e8da0; }
    .newlabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #f2a65a; }
    .code { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="298" rx="12"/>

  <!-- pointer -->
  <text class="name" x="130" y="112" text-anchor="middle">target_hp</text>
  <text class="type" x="130" y="132" text-anchor="middle">int *</text>
  <rect class="ptr" x="50" y="144" width="160" height="56" rx="6"/>
  <text class="value" x="130" y="180" text-anchor="middle">0x1004</text>
  <text class="addr" x="130" y="224" text-anchor="middle">address 0x1008</text>

  <!-- pikachu (old target) -->
  <text class="name" x="500" y="42" text-anchor="middle">pikachu_hp</text>
  <rect class="var" x="440" y="54" width="120" height="50" rx="6"/>
  <text class="value" x="500" y="87" text-anchor="middle">35</text>
  <text class="addr" x="500" y="124" text-anchor="middle">address 0x1000</text>

  <!-- eevee (new target) -->
  <text class="name" x="500" y="172" text-anchor="middle">eevee_hp</text>
  <rect class="var" x="440" y="184" width="120" height="50" rx="6"/>
  <text class="value" x="500" y="217" text-anchor="middle">28</text>
  <text class="addr" x="500" y="254" text-anchor="middle">address 0x1004</text>

  <!-- arrows -->
  <path class="old" d="M 212 160 C 300 120, 360 82, 434 80" marker-end="url(#arrow-old)"/>
  <text class="oldlabel" x="300" y="105" text-anchor="middle">before</text>
  <path class="arrow" d="M 212 184 C 300 196, 360 208, 434 209" marker-end="url(#arrow)"/>
  <text class="newlabel" x="300" y="256" text-anchor="middle">after <tspan class="code">target_hp = &amp;eevee_hp;</tspan></text>

  <text class="note" x="320" y="284" text-anchor="middle">Addresses are made up: real ones are much longer.</text>
</svg>
