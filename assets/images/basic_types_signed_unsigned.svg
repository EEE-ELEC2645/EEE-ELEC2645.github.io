<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
  <title id="title">Signed and unsigned 8-bit ranges</title>
  <desc id="desc">Two number lines lined up at zero. A signed 8-bit integer runs from -128 to 127. An unsigned 8-bit integer runs from 0 to 255. An arrow on the unsigned line shows that 0 minus 1 wraps round to 255.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
    <marker id="arrow-old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77768a"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
    <marker id="arrow-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b392f0"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .region { fill: #393842; stroke: #5a5968; stroke-width: 1.5; }
    .divider { stroke: #4a4955; stroke-width: 1.5; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .cell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .code { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .line { stroke: #7cb7ff; stroke-width: 2.5; fill: none; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .exprlabel { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #f2a65a; }
    .newlabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #f2a65a; }
    .old { stroke: #77768a; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
    .fadedbox { fill: none; stroke: #77768a; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .fadedtext { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #77768a; }
    .oldlabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #8e8da0; }
    .copy { stroke: #b392f0; stroke-width: 3; fill: none; }
    .copylabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #b392f0; }
    .bad { fill: #3d2426; stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .badarrow { stroke: #ff7b72; stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
    .badtext { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #ff7b72; }
    .badcell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #ff7b72; }
    .badnote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #ff7b72; }
    .term { fill: #233a2a; stroke: #7ee787; stroke-width: 2.5; }
    .termtext { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #7ee787; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="348" rx="12"/>
  <text class="name" x="64" y="44">signed 8-bit (int8_t)</text>
  <rect class="var" x="64.0" y="60" width="357.0" height="34" rx="6"/>
  <text class="type" x="64.0" y="116" text-anchor="middle">-128</text>
  <text class="type" x="243.2" y="116" text-anchor="middle">0</text>
  <text class="type" x="421.0" y="116" text-anchor="middle">127</text>
  <text class="name" x="64" y="162">unsigned 8-bit (uint8_t)</text>
  <rect class="var" x="243.2" y="178" width="357.0" height="34" rx="6"/>
  <text class="type" x="243.2" y="234" text-anchor="middle">0</text>
  <text class="type" x="600.2" y="234" text-anchor="middle">255</text>
  <path class="arrow" d="M 259.2 240 C 313.2 300, 530.2 300, 584.2 244" marker-end="url(#arrow)"/>
  <text class="newlabel" x="421.70000000000005" y="300" text-anchor="middle">0 - 1 wraps round to 255</text>
  <text class="note" x="320" y="330" text-anchor="middle">An unsigned int does the same with 32 bits: 0 - 1 gives 4294967295.</text>
</svg>
