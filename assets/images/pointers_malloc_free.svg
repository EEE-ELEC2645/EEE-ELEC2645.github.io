<svg xmlns="http://www.w3.org/2000/svg" width="640" height="368" viewBox="0 0 640 368" role="img" aria-labelledby="title desc">
  <title id="title">A dangling pointer after free, and setting it to NULL</title>
  <desc id="desc">After free(values), the pointer values still contains 0x5000, but the block on the heap is freed: a dashed red arrow points to dashed red boxes marked freed, not yours any more. After values = NULL, the pointer contains NULL and points nowhere.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .region { fill: #393842; stroke: #5a5968; stroke-width: 1.5; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .cell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .bad { fill: #3d2426; stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .badarrow { stroke: #ff7b72; stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
    .badcell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #ff7b72; }
    .badnote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #ff7b72; }
    .divider { stroke: #4a4955; stroke-width: 1.5; }
    .code { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="366" rx="12"/>
  <text class="name" x="40" y="40">after <tspan class="code">free(values);</tspan></text>
  <text class="name" x="105" y="74" text-anchor="middle">values</text>
  <text class="type" x="105" y="91" text-anchor="middle">int *</text>
  <rect class="ptr" x="40" y="100" width="130" height="50" rx="6"/>
  <text class="value" x="105" y="133" text-anchor="middle">0x5000</text>
  <rect class="bad" x="262" y="103" width="34" height="44"/>
  <text class="badcell" x="279" y="132" text-anchor="middle"></text>
  <rect class="bad" x="296" y="103" width="34" height="44"/>
  <text class="badcell" x="313" y="132" text-anchor="middle"></text>
  <rect class="bad" x="330" y="103" width="34" height="44"/>
  <text class="badcell" x="347" y="132" text-anchor="middle"></text>
  <rect class="bad" x="364" y="103" width="34" height="44"/>
  <text class="badcell" x="381" y="132" text-anchor="middle"></text>
  <rect class="bad" x="398" y="103" width="34" height="44"/>
  <text class="badcell" x="415" y="132" text-anchor="middle"></text>
  <rect class="bad" x="432" y="103" width="34" height="44"/>
  <text class="badcell" x="449" y="132" text-anchor="middle"></text>
  <rect class="bad" x="466" y="103" width="34" height="44"/>
  <text class="badcell" x="483" y="132" text-anchor="middle"></text>
  <rect class="bad" x="500" y="103" width="34" height="44"/>
  <text class="badcell" x="517" y="132" text-anchor="middle"></text>
  <rect class="bad" x="534" y="103" width="34" height="44"/>
  <text class="badcell" x="551" y="132" text-anchor="middle"></text>
  <rect class="bad" x="568" y="103" width="34" height="44"/>
  <text class="badcell" x="585" y="132" text-anchor="middle"></text>
  <text class="badnote" x="432" y="88" text-anchor="middle">freed: not yours any more</text>
  <line class="badarrow" x1="172" y1="125" x2="256" y2="125" marker-end="url(#arrow-bad)"/>
  <text class="badnote" x="105" y="172" text-anchor="middle">dangling pointer</text>
  <line class="divider" x1="30" y1="196" x2="610" y2="196"/>
  <text class="name" x="40" y="230">after <tspan class="code">values = NULL;</tspan></text>
  <text class="name" x="105" y="272" text-anchor="middle">values</text>
  <text class="type" x="105" y="289" text-anchor="middle">int *</text>
  <rect class="ptr" x="40" y="298" width="130" height="50" rx="6"/>
  <text class="value" x="105" y="331" text-anchor="middle">NULL</text>
  <text class="note" x="200" y="328">points nowhere, so <tspan class="code">if (values == NULL)</tspan> can catch it</text>
</svg>
