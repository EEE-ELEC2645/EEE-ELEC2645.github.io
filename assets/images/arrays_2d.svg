<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">A two-dimensional array and how it is stored</title>
  <desc id="desc">matrix[2][3] drawn as a grid of two rows and three columns holding 1, 2, 3 and 4, 5, 6. Below, the same six values in memory order, row 0 first: matrix[0][0] to matrix[0][2] hold 1, 2, 3, then matrix[1][0] to matrix[1][2] hold 4, 5, 6.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
    <marker id="arrow-old" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77768a"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
    <marker id="arrow-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b392f0"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .region { fill: #393842; stroke: #5a5968; stroke-width: 1.5; }
    .divider { stroke: #4a4955; stroke-width: 1.5; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .cell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .code { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .line { stroke: #7cb7ff; stroke-width: 2.5; fill: none; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .exprlabel { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #f2a65a; }
    .newlabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #f2a65a; }
    .old { stroke: #77768a; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
    .fadedbox { fill: none; stroke: #77768a; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .fadedtext { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #77768a; }
    .oldlabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #8e8da0; }
    .copy { stroke: #b392f0; stroke-width: 3; fill: none; }
    .copylabel { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #b392f0; }
    .bad { fill: #3d2426; stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .badarrow { stroke: #ff7b72; stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
    .badtext { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #ff7b72; }
    .badcell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #ff7b72; }
    .badnote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #ff7b72; }
    .term { fill: #233a2a; stroke: #7ee787; stroke-width: 2.5; }
    .termtext { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #7ee787; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="328" rx="12"/>
  <text class="name" x="40" y="40">int matrix[2][3]</text>
  <text class="note" x="40" y="62">as a table</text>
  <text class="type" x="165" y="76" text-anchor="middle">col 0</text>
  <text class="type" x="235" y="76" text-anchor="middle">col 1</text>
  <text class="type" x="305" y="76" text-anchor="middle">col 2</text>
  <text class="type" x="118" y="113" text-anchor="end">row 0</text>
  <rect class="var" x="130" y="84" width="70" height="46"/>
  <text class="cell" x="165" y="114" text-anchor="middle">1</text>
  <rect class="var" x="200" y="84" width="70" height="46"/>
  <text class="cell" x="235" y="114" text-anchor="middle">2</text>
  <rect class="var" x="270" y="84" width="70" height="46"/>
  <text class="cell" x="305" y="114" text-anchor="middle">3</text>
  <text class="type" x="118" y="159" text-anchor="end">row 1</text>
  <rect class="var" x="130" y="130" width="70" height="46"/>
  <text class="cell" x="165" y="160" text-anchor="middle">4</text>
  <rect class="var" x="200" y="130" width="70" height="46"/>
  <text class="cell" x="235" y="160" text-anchor="middle">5</text>
  <rect class="var" x="270" y="130" width="70" height="46"/>
  <text class="cell" x="305" y="160" text-anchor="middle">6</text>
  <text class="note" x="370" y="120">row by row in memory</text>
  <line class="arrow" x1="375" y1="130" x2="440" y2="190" marker-end="url(#arrow)"/>
  <text class="note" x="40" y="214">in memory</text>
  <rect class="var" x="40" y="224" width="93" height="46"/>
  <text class="cell" x="86" y="254" text-anchor="middle">1</text>
  <text class="type" x="86" y="290" text-anchor="middle">[0][0]</text>
  <rect class="var" x="133" y="224" width="93" height="46"/>
  <text class="cell" x="179" y="254" text-anchor="middle">2</text>
  <text class="type" x="179" y="290" text-anchor="middle">[0][1]</text>
  <rect class="var" x="226" y="224" width="93" height="46"/>
  <text class="cell" x="272" y="254" text-anchor="middle">3</text>
  <text class="type" x="272" y="290" text-anchor="middle">[0][2]</text>
  <rect class="var" x="319" y="224" width="93" height="46"/>
  <text class="cell" x="365" y="254" text-anchor="middle">4</text>
  <text class="type" x="365" y="290" text-anchor="middle">[1][0]</text>
  <rect class="var" x="412" y="224" width="93" height="46"/>
  <text class="cell" x="458" y="254" text-anchor="middle">5</text>
  <text class="type" x="458" y="290" text-anchor="middle">[1][1]</text>
  <rect class="var" x="505" y="224" width="93" height="46"/>
  <text class="cell" x="551" y="254" text-anchor="middle">6</text>
  <text class="type" x="551" y="290" text-anchor="middle">[1][2]</text>
  <text class="note" x="179.5" y="312" text-anchor="middle">row 0</text>
  <text class="note" x="458.5" y="312" text-anchor="middle">row 1</text>
</svg>
