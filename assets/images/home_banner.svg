<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">ELEC2645 Embedded Systems Project</title>
  <desc id="desc">A retro games console. Its LCD screen shows ELEC2645 in large pixel letters, EMBEDDED SYSTEMS PROJECT, the ELEC2645 Bot d[o_0]b and PRESS START, next to a pixel-art Parkinson Building clock tower. Beside the screen are a joystick and two buttons labelled A and B.</desc>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .screen { fill: #263548; stroke: #7cb7ff; stroke-width: 3; }
    .pix { fill: #f0f0f0; shape-rendering: crispEdges; }
    .tower { fill: #a9a9b8; shape-rendering: crispEdges; }
    .sub { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 19px; fill: #a9a9b8; letter-spacing: 1px; }
    .bot { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 30px; fill: #f2a65a; }
    .start { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 19px; fill: #f0f0f0; }
    .stick { fill: #393842; stroke: #5a5968; stroke-width: 2; }
    .knob { fill: #302f38; stroke: #77768a; stroke-width: 2.5; }
    .btn-a { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .btn-b { fill: #233a2a; stroke: #7ee787; stroke-width: 2.5; }
    .label { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 15px; fill: #f0f0f0; }
    .grille { stroke: #4a4955; stroke-width: 3; stroke-linecap: round; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
