<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
  <title id="title">A pointer on the stack to a block on the heap</title>
  <desc id="desc">On the stack, the pointer values, at address 0x7f00, contains 0x5000. An arrow goes to a block of ten ints on the heap, starting at address 0x5000; each holds a question mark because malloc does not initialise the memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2a65a"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/>
    </marker>
  </defs>
  <style>
    .card { fill: #302f38; stroke: #4a4955; }
    .region { fill: #393842; stroke: #5a5968; stroke-width: 1.5; }
    .name { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 17px; fill: #f0f0f0; }
    .type { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .value { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 22px; fill: #f0f0f0; }
    .cell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #f0f0f0; }
    .addr { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 14px; fill: #a9a9b8; }
    .note { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #a9a9b8; }
    .var { fill: #263548; stroke: #7cb7ff; stroke-width: 2.5; }
    .ptr { fill: #3d2f22; stroke: #f2a65a; stroke-width: 2.5; }
    .arrow { stroke: #f2a65a; stroke-width: 3; fill: none; }
    .bad { fill: #3d2426; stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .badarrow { stroke: #ff7b72; stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
    .badcell { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; font-size: 18px; fill: #ff7b72; }
    .badnote { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #ff7b72; }
    .code { font-family: "DejaVu Sans Mono", Consolas, "Courier New", monospace; }
  </style>
  <rect class="card" x="1" y="1" width="638" height="288" rx="12"/>
  <rect class="region" x="20" y="24" width="170" height="200" rx="8"/>
  <text class="name" x="34" y="50">stack</text>
  <rect class="region" x="230" y="24" width="390" height="200" rx="8"/>
  <text class="name" x="244" y="50">heap</text>
  <text class="name" x="105" y="84" text-anchor="middle">values</text>
  <text class="type" x="105" y="101" text-anchor="middle">int *</text>
  <rect class="ptr" x="40" y="110" width="130" height="50" rx="6"/>
  <text class="value" x="105" y="143" text-anchor="middle">0x5000</text>
  <text class="addr" x="105" y="184" text-anchor="middle">address 0x7f00</text>
  <rect class="var" x="262" y="113" width="34" height="44"/>
  <text class="cell" x="279" y="142" text-anchor="middle">?</text>
  <rect class="var" x="296" y="113" width="34" height="44"/>
  <text class="cell" x="313" y="142" text-anchor="middle">?</text>
  <rect class="var" x="330" y="113" width="34" height="44"/>
  <text class="cell" x="347" y="142" text-anchor="middle">?</text>
  <rect class="var" x="364" y="113" width="34" height="44"/>
  <text class="cell" x="381" y="142" text-anchor="middle">?</text>
  <rect class="var" x="398" y="113" width="34" height="44"/>
  <text class="cell" x="415" y="142" text-anchor="middle">?</text>
  <rect class="var" x="432" y="113" width="34" height="44"/>
  <text class="cell" x="449" y="142" text-anchor="middle">?</text>
  <rect class="var" x="466" y="113" width="34" height="44"/>
  <text class="cell" x="483" y="142" text-anchor="middle">?</text>
  <rect class="var" x="500" y="113" width="34" height="44"/>
  <text class="cell" x="517" y="142" text-anchor="middle">?</text>
  <rect class="var" x="534" y="113" width="34" height="44"/>
  <text class="cell" x="551" y="142" text-anchor="middle">?</text>
  <rect class="var" x="568" y="113" width="34" height="44"/>
  <text class="cell" x="585" y="142" text-anchor="middle">?</text>
  <text class="type" x="432" y="98" text-anchor="middle">10 ints from malloc()</text>
  <text class="addr" x="279" y="178" text-anchor="middle">0x5000</text>
  <line class="arrow" x1="172" y1="135" x2="256" y2="135" marker-end="url(#arrow)"/>
  <text class="note" x="105" y="212" text-anchor="middle">freed automatically</text>
  <text class="note" x="425" y="212" text-anchor="middle">stays until you call <tspan class="code">free(values)</tspan></text>
  <text class="note" x="320" y="252" text-anchor="middle"><tspan class="code">?</tspan> means not initialised: <tspan class="code">malloc()</tspan> does not set the values.</text>
  <text class="note" x="320" y="272" text-anchor="middle">Addresses are made up: real ones are much longer.</text>
</svg>
